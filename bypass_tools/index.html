}

const state = { query:"", filter:"all", open:null, spin:false };
let toastMsg = null, toastTimer = null;

function toast(msg, ms=1600) {
  toastMsg = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMsg = null; renderToast(); }, ms);
  renderToast();
}
function renderToast() {
  let el = document.getElementById("toast");
  if (!toastMsg) { el && el.remove(); return; }
  if (!el) { el = document.createElement("p"); el.id = "toast"; el.setAttribute("role","status");
    el.className = "fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-lg border border-fg/15 bg-raised px-3 py-2 text-sm text-fg"; document.body.appendChild(el); }
  el.textContent = toastMsg;
}

  }).join("");

  '<main class="mx-auto w-full max-w-6xl flex-1 px-4 pb-8">'+content+'</main>'+

function visibleTools() {
  const q = state.query.trim().toLowerCase();
  return tools.filter(t => {
    if (state.filter!=="all" && t.status!==state.filter) return false;
    if (!q) return true;
    return t.name.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || t.kind.toLowerCase().includes(q);
  });
}
function cardsHtml() {
  const v = visibleTools();
  if (!v.length) return '<p class="col-span-full rounded-xl border border-dashed border-fg/15 px-4 py-12 text-center text-sm text-muted">Không có công cụ khớp.</p>';
  return v.map(t => '<article id="'+t.id+'" data-open="'+t.id+'" class="flex h-full cursor-pointer flex-col rounded-xl border border-fg/10 bg-surface p-4 transition-colors hover:border-fg/25 hover:bg-raised">'+
    '<div class="flex items-start gap-3">'+toolMark(t.mark)+'<div class="min-w-0"><h2 class="text-sm font-semibold">'+esc(t.name)+'</h2><p class="mt-1 line-clamp-2 text-xs leading-relaxed text-muted">'+esc(t.description)+'</p></div></div>'+

}

function renderDialog() {
  document.getElementById("dlg")?.remove();

  d.innerHTML = '<div class="fixed inset-0 z-40 bg-bg/70" data-close></div>'+

    '<button type="button" data-close class="inline-flex h-11 items-center rounded-lg border border-fg/15 px-3 text-sm text-fg">Đóng</button></div></div>';
  document.body.appendChild(d);
  d.querySelector("button[data-close]").focus();
}

async function copyTool(t) {
  const text = t.url;
  try { await navigator.clipboard.writeText(text); toast("Đã sao chép"); return; } catch {}
  try {
    const el = document.createElement("textarea"); el.value = text; el.setAttribute("readonly","");
    el.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(el); el.select();
    const ok = document.execCommand("copy"); el.remove(); toast(ok?"Đã sao chép":"Không sao chép được");
  } catch { toast("Không sao chép được"); }
}

function currentPath() {
  let p = location.pathname; if (p.endsWith("index.html")) p = p.slice(0,-10); while (p.length>1 && p.endsWith("/")) p = p.slice(0,-1); p = p || "/";
  return titles[p] ? p : "/";
}
function render() {
  const path = currentPath();
  const content = path==="/home" ? homePage() : path==="/materials" ? materialsPage() : path==="/developing" ? developingPage() : bypassPage();
  document.getElementById("app").innerHTML = shell(content, path);
  document.title = "DuckXKurumi — " + titles[path];
}
function refreshList() {
  const c = document.getElementById("cards"), ch = document.getElementById("chips");
  if (c) c.innerHTML = cardsHtml(); if (ch) ch.innerHTML = chipsHtml();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-open],[data-copy],[data-filter],[data-close],[data-action],#refresh");
  if (!el) return;
  const tool = id => tools.find(t => t.id===id);
  if (el.dataset.go) { e.stopPropagation(); location.href = tool(el.dataset.go).url; return; }
  if (el.dataset.copy) { e.stopPropagation(); copyTool(tool(el.dataset.copy)); return; }
  if (el.dataset.open) { state.open = tool(el.dataset.open); renderDialog(); return; }
  if (el.dataset.filter) { state.filter = el.dataset.filter; refreshList(); return; }
  if (el.dataset.close!==undefined) { state.open = null; renderDialog(); return; }
  if (el.dataset.action==="youtube") { toast("Chưa gắn liên kết YouTube trong bản xem trước.", 1800); return; }
  if (el.id==="refresh") {
    state.query = ""; state.filter = "all"; document.getElementById("q").value = "";
    refreshList(); el.firstElementChild.classList.add("animate-spin");
    setTimeout(() => el.firstElementChild.classList.remove("animate-spin"), 500);
  }
});
document.addEventListener("input", e => { if (e.target.id==="q") { state.query = e.target.value; refreshList(); } });
document.addEventListener("keydown", e => { if (e.key==="Escape" && state.open) { state.open = null; renderDialog(); } });
render();
</script>
</body>
</html>
